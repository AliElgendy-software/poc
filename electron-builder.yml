appId: com.electron.app
productName: servio
directories:
  buildResources: build
files:
  - '**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - 'node_modules/.prisma/**/*'
  - 'node_modules/@prisma/client/**/*'
  - 'node_modules/@prisma/client-sqlite/**/*'
  - 'node_modules/@prisma/client-postgresql/**/*'
  - 'node_modules/@prisma/engines/**/*'
asarUnpack:
  - resources/**
  - "**/*.node"
  - "**/*.dll"
  - "**/@prisma/engines/**"
  - "node_modules/.prisma/**"
  - "node_modules/@prisma/client/**"
  - "node_modules/@prisma/client-sqlite/**"
  - "node_modules/@prisma/client-postgresql/**"
  - "node_modules/@prisma/engines/**"
extraResources:
  - from: "node_modules/.prisma/client"
    to: "node_modules/.prisma/client"
  - from: "node_modules/@prisma/client"
    to: "node_modules/@prisma/client"
  - from: "node_modules/@prisma/client-sqlite"
    to: "node_modules/@prisma/client-sqlite"
  - from: "node_modules/@prisma/client-postgresql"
    to: "node_modules/@prisma/client-postgresql"
  - from: "node_modules/@prisma/engines"
    to: "node_modules/@prisma/engines"
  - from: "prisma"
    to: "prisma"
  - from: "src/main/schema.sql"
    to: "schema.sql"
win:
  executableName: servio
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false # Install for current user but allow changing path (standard wizard)
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  include: build/installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
